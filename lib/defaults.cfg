# ffmpeg_bat_git —— 公共开关的默认值
#
# 两个入口族(ffmpeg_*.bat / ffmpeg_*.sh)都从这里读, 改这一行 = 两族同时生效。
# 写法就两条:
#   * 一行一个 KEY=VALUE; # 开头的行为注释, 空行忽略;
#   * 值不加引号、不写第二个 = 号(cmd 按 = 切分, 第一个之后的全进值)、前后不留空格。
# 已经存在的同名环境变量优先 —— 命令行临时覆盖(EXT=mkv ./ffmpeg_xxx.sh)照旧有效,
#   文件只补那些没设过的键。
# 谁在读: lib/common.sh 的 load_defaults() 与 lib/common.bat 的 :load_defaults。

# ---- EXT: 输出容器 ----
# mp4 = 默认, 命令行与历史版本逐字相同
# mkv = 装得下位图字幕, 代价是 mp4 播放器普遍不认
EXT=mp4

# ---- BITRATE_NO_HALF: 目标码率要不要跳过"查表值 / 2" ----
# 0 = 沿用现有口径: 目标码率 = 查表值 / 2
# 1 = 直接用查表原值, 不除 2
# 两族所有编码入口(含 ffmpeg_dvd_hevc)走同一个口径。
BITRATE_NO_HALF=0

# ---- DVD_EXT: DVD 链路(ffmpeg_dvd_hevc)的输出容器默认值 ----
# 为什么 DVD 单列一个键: mp4 装不下第 2 条 DVD 位图字幕(实测只剩 1 条), 而上面 EXT
#   的默认值是 mp4 —— 让公共默认值直接盖过来等于把 DVD 产物悄悄降级。所以 DVD 的默认
#   口径自己占一行; 命令行显式给 EXT 时仍以 EXT 为准(与 readme「同名同义」一致)。
#   把这一行删掉, DVD 就跟着上面的 EXT 走。
DVD_EXT=mkv
